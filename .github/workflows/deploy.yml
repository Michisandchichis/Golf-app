name: Deploy

on:
  push:
    branches: [main, claude/app-building-getting-started-79nvf1]

jobs:
  publish-expo:
    name: Publish to Expo Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps

      - run: npm install -g eas-cli

      - name: Create or link Expo project
        run: eas init --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to Expo Go
        run: eas update --branch preview --message "Published via GitHub Actions" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
